services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: orthanc-postgres
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orthanc}
      POSTGRES_USER: ${POSTGRES_USER:-orthanc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orthanc_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-orthanc} -d $${POSTGRES_DB:-orthanc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: orthanc-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://orthanc:orthanc_dev@postgres:5432/orthanc}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ORTHANC_MEDIA_DIR: ${ORTHANC_MEDIA_DIR:-/app/data/media}
      ORTHANC_THUMBNAIL_DIR: ${ORTHANC_THUMBNAIL_DIR:-/app/data/media/thumbnails}
      ORTHANC_TELEGRAM_SESSION_DIR: ${ORTHANC_TELEGRAM_SESSION_DIR:-/app/data/telegram_sessions}
      ORTHANC_ANIME_BRIEF_OUTPUT_DIR: ${ORTHANC_ANIME_BRIEF_OUTPUT_DIR:-/app/data/output/anime_briefs}
      # TELEGRAM_BOT_TOKEN: ""  # Set in .env for alert delivery
    volumes:
      - ./backend:/app
      - ${ORTHANC_DATA_DIR:-./data}:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-keep-alive 30
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: orthanc-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend
    restart: unless-stopped
